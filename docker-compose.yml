version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jarvis_lite_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jarvis_lite
      POSTGRES_USER: jarvis_admin
      POSTGRES_PASSWORD: jarvis_secure_password_2026!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis_admin -d jarvis_lite"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
